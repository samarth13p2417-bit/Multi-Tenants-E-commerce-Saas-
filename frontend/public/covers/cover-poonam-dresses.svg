<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1600" height="600" fill="url(#bgGrad)" />
  <circle cx="800" cy="300" r="450" fill="url(#glow)" />

  <!-- Subtle Minimal Geometric Patterns -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="200" cy="150" r="120" />
    <circle cx="1400" cy="450" r="140" />
    <polygon points="1350,100 1450,250 1250,250" />
    <polygon points="250,480 350,330 150,330" />
  </g>

  <!-- Emblem Icon -->
  <g transform="translate(765, 140)" filter="url(#shadow)">
    <path d="M35 5 L45 25 L65 35 L45 45 L35 65 L25 45 L5 35 L25 25 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Typography: Store Name -->
  <g filter="url(#shadow)">
    <text x="800" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="8" fill="#ffffff" text-anchor="middle">
      POONAM DRESSES
    </text>
    <text x="800" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="12" fill="#9ca3af" text-anchor="middle">
      DESIGNER ETHNIC &amp; BRIDAL FASHION
    </text>
  </g>
</svg>
